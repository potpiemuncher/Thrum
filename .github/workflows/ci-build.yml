name: CI Build

# Autobuild that runs on every push and pull request, plus manual triggers.
# Complements release.yml (which only runs when a GitHub Release is published).
# Produces a runnable x64 package as a downloadable build artifact.

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]   # tag pushes are handled by release.yml
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-scripts:
    # The setup script runs elevated on users' machines; the release and
    # measurement scripts are part of the release procedure. Warnings here
    # fail the build like compiler warnings do.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Lint PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $results = @(Get-ChildItem -Path extras, utils -Recurse -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error })
          $results | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer reported $($results.Count) warning(s)." }

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests (x64)
        run: dotnet test .\Thrum.Tests\Thrum.Tests.csproj -c Release -p:Platform=x64 --verbosity normal

  build:
    runs-on: windows-2022
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64 ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Restore dependencies
        run: dotnet restore

      - name: Compute version
        id: ver
        shell: bash
        run: |
          VERSION="$(date +%Y.%m.%d)-ci-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.platform }}
        run: dotnet publish .\Thrum\Thrum.csproj -c Release -r win-${{ matrix.platform }} --self-contained true /p:platform=${{ matrix.platform }} -o .\bin\${{ matrix.platform }}\Release\output

      - name: Package ${{ matrix.platform }}
        run: python .\utils\post-build.py .\bin\${{ matrix.platform }}\Release\output . ${{ env.VERSION }}

      - name: Stage ${{ matrix.platform }} artifact folder
        shell: pwsh
        run: |
          $artifactRoot = ".\bin\${{ matrix.platform }}\Release\artifact"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          Copy-Item -Path ".\bin\${{ matrix.platform }}\Release\Thrum" -Destination $artifactRoot -Recurse -Force

      - name: Upload ${{ matrix.platform }} artifact
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: Thrum_${{ env.VERSION }}_${{ matrix.platform }}
          path: .\bin\${{ matrix.platform }}\Release\artifact
          if-no-files-found: error

      - name: Publish artifact link to run summary
        shell: bash
        run: |
          echo "### Thrum ${{ matrix.platform }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ env.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Thrum_${{ env.VERSION }}_${{ matrix.platform }} (contains Thrum folder)](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

