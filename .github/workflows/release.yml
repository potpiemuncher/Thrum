name: .NET Release

# Runs when a release tag (v0.9.0-beta.3, or a VIIPER... tag) is pushed. The
# tagged commit is tested, built and packaged first; only then do the zip, the
# installer and SHA256SUMS.txt go onto the GitHub release, and only then is the
# release published. A release is never public without its downloads (Thrum's
# update check sends users to the newest one), and a failed build or test
# publishes nothing.
#
# Release notes stay handwritten. Before pushing the tag, save the release on
# GitHub as a draft for that tag, with its title and notes. This workflow
# attaches the files to the draft, adds their SHA-256 to the end of the notes
# and publishes it. With no draft for the tag, it creates one with the files and
# checksums and leaves it unpublished for the notes to be written.

on:
  push:
    tags: [ "v*", "VIIPER*" ]

permissions:
  contents: write

# Two pushes of the same tag never publish at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    env:
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Restore dependencies
      run: dotnet restore
    - name: Set envars for versions
      run: |
        # Later steps paste the tag and the version into PowerShell lines, so
        # accept only a plain tag name.
        if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
          echo "::error::Tag '$TAG' is not a plain release tag (letters, digits and . _ + - only)."
          exit 1
        fi
        VERSION=${TAG#v}
        # Versions live in the repository-root Directory.Build.props, not in the
        # project file - see the comment in that file before moving them again.
        PROJECT_ASSEMBLY_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').find('.//AssemblyVersion').text)")
        PROJECT_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').find('.//Version').text)")
        PROJECT_INFORMATIONAL_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').find('.//InformationalVersion').text)")
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-.*)?$ ]]; then
          BINARY_VERSION=${VERSION%%-*}
          PACKAGE_VERSION=$VERSION
        else
          BINARY_VERSION=$PROJECT_ASSEMBLY_VERSION
          PACKAGE_VERSION=$PROJECT_VERSION
        fi
        # The informational version names the upstream base after the version,
        # " (base: hbashton DS4Windows 4.0.2.1 @ 5d2724a)". Directory.Build.props
        # says why it must never be shortened; a release keeps it after its own
        # version.
        if [[ "$PROJECT_INFORMATIONAL_VERSION" != *" (base: "*")" ]]; then
          echo "::error::InformationalVersion in Directory.Build.props has no '(base: ...)' part: $PROJECT_INFORMATIONAL_VERSION"
          exit 1
        fi
        INFORMATIONAL_VERSION="$VERSION (base: ${PROJECT_INFORMATIONAL_VERSION#* (base: }"
        # A version with a suffix (0.9.0-beta.3) or a VIIPER tag is published
        # as a prerelease; a plain 1.2.3 is not.
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
          PRERELEASE=false
        else
          PRERELEASE=true
        fi
        echo "Release: $VERSION; binary: $BINARY_VERSION; package: $PACKAGE_VERSION; informational: $INFORMATIONAL_VERSION; prerelease: $PRERELEASE"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "BINARY_VERSION=$BINARY_VERSION" >> "$GITHUB_ENV"
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
        echo "INFORMATIONAL_VERSION=$INFORMATIONAL_VERSION" >> "$GITHUB_ENV"
        echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
      shell: bash
    # A release is built from the tagged commit, which may never have been
    # through the CI workflow; publish nothing that fails its own tests.
    - name: Run tests (x64)
      run: dotnet test .\Thrum.Tests\Thrum.Tests.csproj -c Release -p:Platform=x64
    - name: Build X64
      # The informational version has spaces in it, so it is quoted.
      shell: pwsh
      run: dotnet publish .\Thrum\Thrum.csproj -c Release -r win-x64 --self-contained true /p:platform=x64 /p:AssemblyVersion=${{ env.BINARY_VERSION }} /p:FileVersion=${{ env.BINARY_VERSION }} /p:Version=${{ env.PACKAGE_VERSION }} "/p:InformationalVersion=$env:INFORMATIONAL_VERSION" -o .\bin\x64\Release\output
    - name: Check the version in the binaries
      # Read back what was built, so a quoting slip cannot ship a binary that
      # lost its "(base: ...)" part. Thrum shows Thrum.exe's product version.
      shell: pwsh
      run: |
        foreach ($file in 'Thrum.exe', 'Thrum.dll') {
          $actual = (Get-Item -LiteralPath ".\bin\x64\Release\output\$file").VersionInfo.ProductVersion
          if ($actual -cne $env:INFORMATIONAL_VERSION) {
            throw "$file has product version '$actual', expected '$env:INFORMATIONAL_VERSION'."
          }
          Write-Output "$file product version: $actual"
        }
    - name: Post-Build script X64
      # The fourth argument is the exact release tag. post-build.py writes it to
      # Thrum.release beside the executable so the published build recognises
      # itself as the newest prerelease instead of offering an "update" to it.
      run: python .\utils\post-build.py .\bin\x64\Release\output . ${{env.VERSION}} ${{ env.TAG }}
    - name: Name release asset
      shell: pwsh
      run: |
        $source = ".\bin\x64\Release\Thrum_${{ env.VERSION }}_x64.zip"
        $asset = if ("${{ env.VERSION }}" -like "VIIPER*") {
          ".\bin\x64\Release\Thrum_VIIPER_x64.zip"
        } else {
          $source
        }
        if ($asset -ne $source) {
          Move-Item -LiteralPath $source -Destination $asset -Force
        }
        "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
    - name: Build installer X64
      shell: pwsh
      run: |
        $name = if ("${{ env.VERSION }}" -like "VIIPER*") {
          "Thrum_VIIPER_x64_setup"
        } else {
          "Thrum_${{ env.VERSION }}_x64_setup"
        }
        .\utils\build-installer.ps1 -PackageDir .\bin\x64\Release\Thrum -Version "${{ env.VERSION }}" -BinaryVersion "${{ env.BINARY_VERSION }}" -OutputDir .\bin\x64\Release -OutputBaseFilename $name -InstallInnoSetup
        "RELEASE_INSTALLER=.\bin\x64\Release\$name.exe" >> $env:GITHUB_ENV
    - name: Compute SHA-256 checksums
      # The README tells users to check a download against the SHA-256 on the
      # release page. SHA256SUMS.txt (sha256sum format, the hash in the case
      # Get-FileHash prints it) is attached to the release, and the same
      # values go at the end of the release notes.
      shell: pwsh
      run: |
        $invariant = [System.Globalization.CultureInfo]::InvariantCulture
        $files = @(Get-Item -LiteralPath $env:RELEASE_INSTALLER, $env:RELEASE_ASSET)
        $sums = Join-Path -Path $files[0].DirectoryName -ChildPath 'SHA256SUMS.txt'
        $sumsLines = @()
        $tableRows = @()
        foreach ($file in $files) {
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          $sumsLines += "$hash  $($file.Name)"
          $tableRows += '| `{0}` | {1} | `{2}` |' -f $file.Name, $file.Length.ToString('N0', $invariant), $hash
        }
        # UTF-8 without a byte order mark, which sha256sum -c would misread.
        [System.IO.File]::WriteAllText($sums, ($sumsLines -join "`n") + "`n")
        $notes = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'sha256-notes.md'
        $section = @(
          '## SHA-256 checksums'
          ''
          'Check a download before you run it: in PowerShell, `Get-FileHash .\<file name>` must print the same hash. The same list is attached as `SHA256SUMS.txt`.'
          ''
          '| File | Size (bytes) | SHA-256 |'
          '| --- | ---: | --- |'
        ) + $tableRows
        [System.IO.File]::WriteAllText($notes, ($section -join "`n") + "`n")
        $sumsLines | Write-Output
        "RELEASE_SUMS=$sums" >> $env:GITHUB_ENV
        "RELEASE_SUMS_NOTES=$notes" >> $env:GITHUB_ENV
    - name: Publish the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        assets=("$RELEASE_ASSET" "$RELEASE_INSTALLER" "$RELEASE_SUMS")
        prerelease=()
        if [[ "$PRERELEASE" == true ]]; then
          prerelease=(--prerelease)
        fi
        notes="$RUNNER_TEMP/release-notes.md"
        cat "$RELEASE_SUMS_NOTES" >> "$GITHUB_STEP_SUMMARY"

        # Drafts are listed only to a token that can write to the repository,
        # which this one can.
        found=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
          --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")

        if [[ -z "$found" ]]; then
          {
            echo "_No draft release was prepared for $TAG, so the release workflow created this one. Write the release notes above the checksums, then publish it._"
            echo
            cat "$RELEASE_SUMS_NOTES"
          } > "$notes"
          gh release create "$TAG" "${assets[@]}" --draft --verify-tag "${prerelease[@]}" --title "Thrum $VERSION" --notes-file "$notes"
          echo "::warning::No draft release existed for $TAG. A draft with the downloads attached was created and left unpublished: write its notes on GitHub and publish it."
          exit 0
        fi
        if [[ $(wc -l <<< "$found") -ne 1 ]]; then
          echo "::error::More than one release uses the tag $TAG (id, draft): $found"
          exit 1
        fi
        read -r id draft <<< "$found"

        gh release upload "$TAG" "${assets[@]}" --clobber

        # The notes as written, without the checksums an earlier run of this
        # workflow added (and without trailing blank lines), then the new ones.
        gh api "repos/$GH_REPO/releases/$id" --jq '.body // ""' |
          awk -v heading='## SHA-256 checksums' '
            { sub(/\r$/, "") }
            $0 == heading { skip = 1 }
            skip { next }
            /^[[:space:]]*$/ { blank++; next }
            { while (blank > 0) { print ""; blank-- } print }
          ' > "$notes"
        { echo; cat "$RELEASE_SUMS_NOTES"; } >> "$notes"

        if [[ "$draft" == true ]]; then
          # A beta tag is never published as a full release, which the update
          # check would offer to users on the stable channel.
          gh release edit "$TAG" --notes-file "$notes" --draft=false "${prerelease[@]}"
          echo "Published release $TAG with its downloads attached."
        else
          gh release edit "$TAG" --notes-file "$notes"
          echo "::warning::Release $TAG was already public before its downloads were attached. Next time save it as a draft before pushing the tag."
        fi
